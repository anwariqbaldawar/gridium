<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="420" style="background:#090a09;border-radius:12px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,0.6);">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c0a"/>
      <stop offset="45%" stop-color="#111511"/>
      <stop offset="75%" stop-color="#0e110e"/>
      <stop offset="100%" stop-color="#080908"/>
    </linearGradient>

    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3e4a3b" stop-opacity="0.2"/>
      <stop offset="25%" stop-color="#697a64" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e2e8df" stop-opacity="1"/>
      <stop offset="75%" stop-color="#697a64" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3e4a3b" stop-opacity="0.2"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="7s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9b084"/>
      <stop offset="50%" stop-color="#f5e6cc"/>
      <stop offset="100%" stop-color="#b89b6a"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2d3a2b" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#141a13" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#090a09" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="arch-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="1" fill="rgba(255,255,255,0.12)"/>
    </pattern>

    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      @keyframes sweepBorder {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 800; }
      }
      .brand-title {
        font-family: 'Syne', 'Playfair Display', 'Cinzel', Georgia, serif;
        font-weight: 700;
        letter-spacing: 0.35em;
        text-shadow: 0 4px 20px rgba(0,0,0,0.8);
      }
      .mono-tag {
        font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .sans-sub {
        font-family: 'Jost', 'Inter', -apple-system, sans-serif;
        letter-spacing: 0.12em;
      }
      .pulse-chip {
        animation: pulse 3s infinite ease-in-out;
      }
      .floating {
        animation: floatSlow 5s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" fill="url(#glow)"/>
  <rect width="1200" height="420" fill="url(#arch-grid)"/>

  <!-- Architectural Hairlines & Blueprint Crosshairs -->
  <line x1="80" y1="0" x2="80" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="1120" y1="0" x2="1120" y2="420" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="70" x2="1200" y2="70" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="350" x2="1200" y2="350" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <!-- Crosshair markers -->
  <g stroke="rgba(255,255,255,0.25)" stroke-width="1">
    <path d="M 75 70 H 85 M 80 65 V 75"/>
    <path d="M 1115 70 H 1125 M 1120 65 V 75"/>
    <path d="M 75 350 H 85 M 80 345 V 355"/>
    <path d="M 1115 350 H 1125 M 1120 345 V 355"/>
  </g>

  <!-- Top Badges / Coordinate Meta -->
  <g transform="translate(100, 48)">
    <circle cx="4" cy="4" r="3" fill="#4ade80" class="pulse-chip"/>
    <text x="18" y="7" fill="#86efac" font-size="10" class="mono-tag" font-weight="600">ENTERPRISE GRADE · PRODUCTION VERIFIED</text>
  </g>
  <g transform="translate(850, 48)">
    <text x="250" y="7" text-anchor="end" fill="rgba(255,255,255,0.4)" font-size="10" class="mono-tag">ONLINE STORE 2.0 · v1.3.0</text>
  </g>

  <!-- Center Logo Monogram -->
  <g transform="translate(600, 130)" text-anchor="middle" class="floating">
    <!-- Geometric Monogram Emblem -->
    <rect x="-32" y="-32" width="64" height="64" rx="14" fill="#121612" stroke="url(#shimmer)" stroke-width="1.5"/>
    <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Interlocking G & Grid geometry -->
    <path d="M -10 -12 H 10 M 0 -12 V 12 M -12 0 H 12 M -8 10 H 8" stroke="url(#gold-accent)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="rgba(212,175,55,0.3)" stroke-dasharray="3 3"/>
  </g>

  <!-- Master Brand Title -->
  <text x="600" y="222" text-anchor="middle" fill="#FFFFFF" font-size="44" class="brand-title">G R I D I U M</text>
  
  <!-- Sleek Accent Line -->
  <line x1="480" y1="240" x2="720" y2="240" stroke="url(#shimmer)" stroke-width="1.5"/>

  <!-- Subtitle -->
  <text x="600" y="272" text-anchor="middle" fill="#cfd6cd" font-size="13.5" class="sans-sub" font-weight="400">
    ARCHITECTURAL ONLINE STORE 2.0 THEME &amp; REACT STUDIO PREVIEW ENGINE
  </text>
  <text x="600" y="295" text-anchor="middle" fill="rgba(255,255,255,0.45)" font-size="11" class="mono-tag">
    CRAFTED FOR LUXURY SHIRTING, BESPOKE TAILORING &amp; HIGH-GROWTH DTC BRANDS
  </text>

  <!-- Metric Badges Row (Bottom) -->
  <g transform="translate(100, 362)">
    <!-- Metric 1 -->
    <g transform="translate(40, 18)">
      <text x="0" y="0" fill="#f5e6cc" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700">0</text>
      <text x="18" y="-1" fill="rgba(255,255,255,0.5)" font-size="10.5" class="mono-tag">OFFENSES (THEME-CHECK)</text>
    </g>

    <line x1="260" y1="5" x2="260" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 2 -->
    <g transform="translate(300, 18)">
      <text x="0" y="0" fill="#f5e6cc" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700">43</text>
      <text x="26" y="-1" fill="rgba(255,255,255,0.5)" font-size="10.5" class="mono-tag">MODULAR SECTIONS</text>
    </g>

    <line x1="510" y1="5" x2="510" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 3 -->
    <g transform="translate(550, 18)">
      <text x="0" y="0" fill="#f5e6cc" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700">16</text>
      <text x="26" y="-1" fill="rgba(255,255,255,0.5)" font-size="10.5" class="mono-tag">REUSABLE SNIPPETS</text>
    </g>

    <line x1="750" y1="5" x2="750" y2="28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Metric 4 -->
    <g transform="translate(790, 18)">
      <text x="0" y="0" fill="#4ade80" font-size="15" font-family="'JetBrains Mono', monospace" font-weight="700">100%</text>
      <text x="48" y="-1" fill="rgba(255,255,255,0.5)" font-size="10.5" class="mono-tag">ZERO-CONFIG DEPLOY</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="11" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
</svg>
